<html>
<head>
<head><title>
FORM
</title>
<link rel="stylesheet" href="P5.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>
<div>
<center>
<h1>Registartion Form</h2>
</center>
<form>
<fieldset>
<i class="fa-solid fa-user"></i>
<legend>User Information</legend>
<label>Name:</label>
      <select>
      <option>Mr.</option>
      <option>Ms.</option>
      <option>Miss.</option>
        </select>
<input type="text" id="name" required>
<br><br>
<i class="fa-solid fa-phone"></i>
<label>phone</label><br>
<input type="tel" id="number" required>
<br>
<i class="fa-solid fa-envelope"></i>
<label>Email</label><br>
<input type="email" id="mail" required>
</fieldset>
<br>
<i class="fa-solid fa-address-book"></i>
<label>Address</label>
<textarea></textarea>
<br><br>
<i class="fa-solid fa-venus-mars"></i>
<label>Gender</label>
<input type="radio" id="male" name="gender">Male</input>
<input type="radio" id="female" name="gender">Female</input>
<input type="radio" id="other" name="gender">Other</input>

<br><br>
<i class="fa-solid fa-language"></i>
<label>Languages known</label>
<input type="checkbox">English</input>
<input type="checkbox">Malayalam</input>
<input type="checkbox">Hindi</input>
<br><br>
<label>Courses</label>
      <select>
      <option>Courses</option>
      <option>Btech-EEE</option>
      <option>Btech-CS</option>
      <option>Btech-IT</option>
      <option>Btech-MECH</option>
      <option>MBA</option>
      <option>MCA</option>
</select>
<center>
<i class="fa-solid fa-rotate-left"></i>
<button type="reset">Reset</button>
<i class="fa-solid fa-upload"></i>
<button type="submit">Submit</button>
</center>
</form>
</div>
</body>
</html>
