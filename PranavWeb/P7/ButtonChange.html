<html>
<head><title>
Color Change</title>
<style>
button{
width:250px; height:250px; font-size:50px; position:fixed;top:30%;left:40%;
}
h1{
position:fixed;top:60%; right:42%;
}
</style>
</head>
<body>
<center>
<h1>to change BgColor</h1>
<button onclick="Change()"; ><b><u>Click Me</b></u></button>
</center>
<script>
function Change()
  {
    var r=Math.floor(Math.random()*256);
    var g=Math.floor(Math.random()*256);
    var b=Math.floor(Math.random()*256);
    
    document.body.style.backgroundColor="rgb("+r+","+g+","+b+")";
    }
</script>
</body>
</html>
