<html>
<head>
<title>Mouse Hover</title>
<style>
img{
border-radius:50%;
height:100;
position:fixed;
top:30%;
left:43%;
box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19);
}
p{
position:fixed;
top:42%;
left:43%;
}

</style>
</head>
<body>
<center>
<div>
<img src="Messi1.jpeg" id="image" onmouseover="one()" onmouseout="two()">
<p id="p1"></p>
</center>
<script>
function one()
{
document.getElementById("image").src="Messi8.jpeg";
document.getElementById("p1").innerHTML="LastBallandor";
document.getElementById("p1").style.color="blue";
}
function two()
{
document.getElementById("image").src="MessiWC.jpeg";
document.getElementById("p1").innerHTML="WorldCup";
document.getElementById("p1").style.color="red";
}
</script>
</div>
</body>
</html>
